<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e67e22">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <title>Würfelboard v0.9855 Stable</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #e67e22; --win: #27ae60; --ronny: #e74c3c;
            --bg: #1a1a1a; --card-bg: #2c2c2c; --text: #eeeeee; --border: #444444;
            --input-focus: #3d3d3d; --table-head: #111111;
            --score-main: #000000; --orange-bar: #ff9800;
            --locked: #f1c40f;
            --near-win-bg: #d35400;
            --track-bg: #1e272e;
            --track-name: #ffffff;
            --modal-backdrop: rgba(0, 0, 0, 0.75);
        }
        body.light-mode {
            --bg: #f8f9fa; --card-bg: #ffffff; --text: #1a1a1a; --border: #cccccc;
            --input-focus: #fffde7; --table-head: #2c3e50;
            --score-main: #111111; --orange-bar: #e67e22;
            --near-win-bg: #ffeaa7;
            --track-bg: #dcdde1;
            --track-name: #2c3e50;
            --modal-backdrop: rgba(0, 0, 0, 0.6);
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- MOBILE TUNING --- */
        body.mobile-mode .app { 
            display: flex; 
            flex-direction: column; 
            padding-bottom: 340px !important; 
            width: 100vw;
            max-width: 100vw;
            border-radius: 0;
            height: auto !important;
            overflow-x: hidden !important;
        } 
        body.mobile-mode .game-container {
            flex: none !important;
            height: auto !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow: visible !important;
        }
        body.mobile-mode .quick-pad { 
            position: fixed; bottom: 0; left: 0; width: 100vw !important;
            background: var(--card-bg); 
            padding: 6px; border-top: 3px solid var(--accent);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6); z-index: 1100; box-sizing: border-box;
            align-self: stretch !important;
            height: auto !important;
            display: block !important;
        }
        body.mobile-mode .pad-btn { padding: 15px 0 !important; font-size: 1rem !important; }
        body.mobile-mode .btn-ronny { 
            grid-column: 1 / -1 !important; 
            padding: 15px 0 !important; 
        }
        
        body.mobile-mode .table-area { 
            max-height: none !important; 
            overflow-x: auto !important; 
            overflow-y: visible !important;
            margin-bottom: 20px;
            flex: none !important;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box;
        }
        
        body.mobile-mode table { width: 100%; min-width: 100%; margin-bottom: 0; table-layout: fixed; }
        body.mobile-mode tfoot td { 
            position: relative; 
            z-index: 10; 
            background: var(--orange-bar); 
            border-top: 2px solid #000; 
            padding: 8px 2px !important;
        }
        body.mobile-mode .score-box {
            justify-content: space-between !important;
            gap: 2px;
        }
        body.mobile-mode .score-mobile-name {
            display: block !important;
            font-size: 0.75rem !important;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.6);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* FIXIERTE RENNBAHN-KOPIE (OVERLAY) */
        .race-track-sticky-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            z-index: 1200;
            box-sizing: border-box;
            padding: 10px;
            background: var(--track-bg);
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            display: none;
        }
        body.mobile-mode .race-track-sticky-overlay .race-lane { height: 40px !important; }
        body.mobile-mode .race-track-sticky-overlay .race-name-field { width: 75px !important; min-width: 75px !important; font-size: 0.75rem !important; }
        body.mobile-mode .race-track-sticky-overlay .race-horse-emoji { font-size: 1.8rem !important; }
        body.mobile-mode .race-track-sticky-overlay .race-horse-text { font-size: 0.7rem !important; }

        /* --- MOBILE LANDSCAPE TUNING --- */
        @media (orientation: landscape) {
            body.mobile-mode .app {
                padding-bottom: 0px !important;
                box-sizing: border-box;
            }
            body.mobile-mode.few-players .app {
                padding-right: 280px !important;
            }
            body.mobile-mode.many-players .app {
                padding-right: 185px !important;
            }
            body.mobile-mode .quick-pad {
                top: 0 !important;
                right: 0 !important;
                left: auto !important;
                bottom: 0 !important;
                height: 100vh !important;
                border-top: none !important;
                border-left: 3px solid var(--accent);
                box-shadow: -10px 0 25px rgba(0,0,0,0.6);
                padding: 6px;
                align-self: stretch !important;
            }
            body.mobile-mode.few-players .quick-pad {
                width: 270px !important;
            }
            body.mobile-mode.many-players .quick-pad {
                width: 175px !important;
            }
            body.mobile-mode .pad-btn {
                padding: 10px 0 !important;
                font-size: 0.9rem !important;
            }
            body.mobile-mode .btn-ronny {
                grid-column: 1 / -1 !important;
                padding: 10px 0 !important;
            }

            body.mobile-mode .table-area {
                height: calc(100vh - 20px) !important;
                margin-bottom: 0 !important;
                padding-bottom: 0 !important;
                overflow-y: auto !important;
            }

            body.mobile-mode table {
                height: auto !important;
            }

            body.mobile-mode tfoot td {
                position: sticky !important;
                bottom: 0 !important;
            }

            body.mobile-mode .table-area {
                scroll-padding-bottom: 72px !important;
            }
        }

        /* --- BASE / DESKTOP --- */
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); display: flex; justify-content: center; transition: 0.3s; }
        
        .app { 
            background: var(--card-bg); 
            border-radius: 0; 
            padding: 15px; 
            width: 100vw; 
            max-width: none; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            height: 100vh; 
            box-sizing: border-box;
            overflow: hidden; 
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
        .btn-top { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        
        .stats-section { background: var(--table-head); color: white; padding: 8px; border-radius: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; text-align: center; flex-shrink: 0; }
        .stat-item { border-right: 1px solid #444; display: flex; flex-direction: column; }
        .stat-name { font-size: 0.6rem; color: #888; }
        .stat-wins { font-size: 0.9rem; font-weight: bold; color: #f1c40f; }
        .stat-wins .pending-win { color: #27ae60; font-weight: bold; animation: blinker 1s linear infinite; margin-left: 2px; }
        
        .setup-section { background: rgba(128,128,128,0.1); padding: 8px; border-radius: 10px; flex-shrink: 0; }
        .names-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
        .name-slot { display: flex; flex-direction: column; gap: 4px; background: var(--card-bg); padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
        .name-slot input { border: 1px solid var(--border); border-radius: 4px; background: rgba(0,0,0,0.1); color: var(--text); text-align: center; padding: 4px; }
        .btn-starter { font-size: 0.6rem; padding: 3px; cursor: pointer; border: none; border-radius: 4px; background: #444; color: #ccc; }
        .btn-starter.active { background: var(--accent); color: white; }
        
        .game-container { display: flex; flex-direction: row; gap: 15px; flex: 1; min-height: 0; overflow: hidden; }
        
        .table-area { 
            flex: 2; 
            background: rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            height: 100%; 
            overflow-y: auto; 
        }

        table { width: 100%; max-width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        thead { position: sticky; top: 0; z-index: 100; }
        thead th { background: var(--table-head); color: white; padding: 10px 2px; font-size: 0.8rem; border: 1px solid var(--border); }
        
        tfoot td { position: sticky; bottom: 0; z-index: 90; background: var(--orange-bar); color: var(--score-main); font-weight: bold; }
        td { border: 1px solid var(--border); height: 42px; text-align: center; }
        
        .score-input { width: 100%; height: 100%; border: none; text-align: center; font-size: 1.1rem; background: transparent; color: var(--text); outline: none; }
        .score-input.system-focus { background: var(--input-focus); box-shadow: inset 0 0 0 3px var(--accent); font-weight: bold; }
        
        /* --- PAD SEITEN ARCHITEKTUR --- */
        .quick-pad { width: 450px; flex-shrink: 0; align-self: stretch; height: 100%; position: relative; }
        .pad-viewport { width: 100%; height: calc(100% - 15px); overflow-x: auto; overflow-y: hidden; display: flex; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .pad-viewport::-webkit-scrollbar { display: none; }
        .pad-viewport { -ms-overflow-style: none; scrollbar-width: none; }
        .pad-page { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; box-sizing: border-box; }
        body.mobile-mode .pad-page { grid-template-columns: repeat(4, 1fr) !important; }
        body.mobile-mode .pad-viewport { height: auto !important; }
        @media (orientation: landscape) {
            body.mobile-mode .pad-page { grid-template-columns: repeat(3, 1fr) !important; }
            body.mobile-mode .pad-viewport { height: calc(100% - 15px) !important; overflow-y: auto; }
        }
        .pad-dots { display: flex; justify-content: center; gap: 6px; margin-top: 5px; height: 10px; align-items: center; }
        .pad-dot { width: 6px; height: 6px; background: #555; border-radius: 50%; transition: 0.2s; }
        .pad-dot.active { background: var(--accent); width: 8px; height: 8px; }

        .pad-btn { padding: 0 2px; border: none; border-radius: 8px; background: #34495e; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .pad-btn:disabled { background: #555; color: var(--locked); }
        .btn-ronny { background: var(--ronny) !important; grid-column: span 4; padding: 0; }
        body.mobile-mode .btn-ronny { grid-column: span 4 !important; }
        @media (orientation: landscape) {
            body.mobile-mode .btn-ronny { grid-column: span 3 !important; }
        }
        
        .score-box { display: flex; flex-direction: column; line-height: 1.1; height: 100%; justify-content: center; }
        .score-box.near-win { animation: nearWinBlinker 1.2s linear infinite; }
        .score-box.winner-blink { background-color: var(--win); animation: blinker 1.2s linear infinite; }
        .score-box.winner-blink .score-down { color: #ffffff !important; }
        .score-box.winner-blink .score-up { color: rgba(255, 255, 255, 0.8) !important; }
        .score-mobile-name { display: none; }
        
        @keyframes blinker {
            50% { opacity: 0.4; }
        }

        @keyframes nearWinBlinker {
            0% { background-color: var(--orange-bar); }
            50% { background-color: var(--near-win-bg); }
            100% { background-color: var(--orange-bar); }
        }

        .score-up { font-size: 1.0rem; color: rgba(0, 0, 0, 0.65); font-weight: bold; }
        .score-down { font-size: 1.6rem; color: #000000; font-weight: 900; }
        
        .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; flex-shrink: 0; opacity: 1; max-height: 500px; overflow: hidden; transition: max-height 0.2s ease-out, opacity 0.15s ease-out; }
        .analysis-card { background: rgba(128,128,128,0.1); padding: 10px; border-radius: 8px; border-top: 3px solid var(--accent); border: 1px solid var(--border); }
        .analysis-grid.slide-hide { max-height: 0 !important; opacity: 0 !important; padding-top: 0 !important; margin-top: 0 !important; border: none !important; }

        /* --- RENNBAHN ARCHITEKTUR --- */
        .race-track-container { display: block; background: var(--track-bg); border: 2px solid var(--accent); border-radius: 12px; padding: 10px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); max-height: 0; opacity: 0; overflow: hidden; border-color: transparent; padding-top: 0; padding-bottom: 0; margin-top: 0; transition: max-height 0.2s ease-out, opacity 0.15s ease-out; }
        .race-track-container.slide-show { max-height: 500px; opacity: 1; border-color: var(--accent); padding-top: 10px; padding-bottom: 10px; margin-top: 10px; }
        
        .race-lane { display: flex; align-items: center; justify-content: flex-start; position: relative; height: 46px; border-bottom: 1px dashed rgba(128,128,128,0.3); padding-right: 50px; box-sizing: border-box; cursor: pointer; transition: background 0.1s; }
        .race-lane:hover { background: rgba(255,255,255,0.05); }
        .race-lane:last-child { border-bottom: none; }
        
        .race-name-field { width: 90px; min-width: 90px; font-size: 0.85rem; font-weight: bold; color: var(--track-name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 5px; z-index: 5; }
        .race-track-path { flex: 1; position: relative; height: 100%; display: flex; align-items: center; }

        .race-horse-wrapper { position: absolute; left: 0; display: flex; align-items: center; height: 100%; white-space: nowrap; transition: left 4.5s cubic-bezier(0.25, 1, 0.5, 1); will-change: left; }
        
        .race-horse-emoji { font-size: 2.0rem; z-index: 2; margin-left: 4px; display: inline-block; } 
        .race-horse-emoji.mirror { transform: scaleX(-1); }
        
        .race-horse-text { font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.4); padding: 1px 4px; border-radius: 4px; color: #fff; }
        
        .race-finish-line { position: absolute; right: 0px; top: 0; bottom: 0; width: 2px; border-left: 2px dashed #ffffff; display: flex; align-items: center; justify-content: flex-start; padding-left: 4px; font-size: 1.1rem; z-index: 4; }

        body.mobile-mode .race-lane { height: 40px !important; } 
        body.mobile-mode .race-name-field { width: 75px !important; min-width: 75px !important; font-size: 0.75rem !important; }
        body.mobile-mode .race-horse-emoji { font-size: 1.8rem !important; } 
        body.mobile-mode .race-horse-text { font-size: 0.7rem !important; }

        #histView { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; display:none; padding:10px; overflow-y:auto; box-sizing: border-box; }
        .history-item { background:#333; padding:8px 12px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; color:white; font-size: 0.85rem; border-left: 4px solid var(--accent); }
        .btn-load-hist { background:var(--win); border:none; color:white; padding:6px 10px; border-radius:4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        .emoji-picker-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 2500;
            display: none; justify-content: center; align-items: center; box-sizing: border-box;
            padding: 15px;
        }
        .emoji-picker-content {
            background: var(--card-bg); border: 2px solid var(--accent); border-radius: 12px;
            padding: 15px; max-width: 320px; width: 100%; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .emoji-picker-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px;
        }
        .emoji-select-btn {
            font-size: 1.8rem; background: rgba(0,0,0,0.15); border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; padding: 5px 0; transition: transform 0.1s, background 0.1s;
        }
        .emoji-select-btn:hover { background: var(--accent); transform: scale(1.1); }

        /* --- CUSTOM MODALS SYSTEM (v0.9855) --- */
        .custom-modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--modal-backdrop); z-index: 4000;
            display: none; justify-content: center; align-items: center; box-sizing: border-box;
            padding: 20px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .custom-modal-content {
            background: var(--card-bg); border: 3px solid var(--accent); border-radius: 16px;
            padding: 20px; max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            color: var(--text); box-sizing: border-box;
            animation: modalPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-modal-title { margin: 0 0 12px 0; color: var(--accent); font-size: 1.3rem; font-weight: bold; }
        .custom-modal-text { font-size: 1rem; line-height: 1.4; margin-bottom: 20px; white-space: pre-line; text-align: center; }
        .custom-modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { flex: 1; border: none; padding: 12px 0; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; color: white; }
        .modal-btn-yes { background: var(--win); }
        .modal-btn-no { background: var(--ronny); }
        .modal-btn-ok { background: var(--primary); }
    </style>
</head>
<body id="mainBody">

<div id="raceTrackStickyCopy" class="race-track-sticky-overlay"></div>

<div id="customModal" class="custom-modal-backdrop">
    <div class="custom-modal-content">
        <div id="customModalTitle" class="custom-modal-title">Meldung</div>
        <div id="customModalText" class="custom-modal-text">Inhalt der Meldung...</div>
        <div id="customModalButtons" class="custom-modal-buttons"></div>
    </div>
</div>

<div id="emojiPicker" class="emoji-picker-modal" onclick="closeEmojiPicker(event)">
    <div class="emoji-picker-content" onclick="event.stopPropagation()">
        <h3 id="emojiPickerTitle" style="margin: 0 0 5px 0; color: var(--accent); font-size: 1.1rem;">Gefährt wählen</h3>
        <div style="font-size: 0.8rem; color: #aaa;">Wähle dein Symbol für die Rennbahn</div>
        <div class="emoji-picker-grid" id="emojiPickerGrid"></div>
        <button class="btn-top" style="background: var(--ronny); margin-top: 15px; width: 100%; padding: 8px 0;" onclick="document.getElementById('emojiPicker').style.display='none'">Abbrechen</button>
    </div>
</div>

<div class="app">
    <div id="arcBanner" style="display:none; background:var(--accent); color:white; padding:10px; text-align:center; font-weight:bold; position:fixed; top:0; width:100%; z-index:2000;" onclick="exitArchive()">⚠️ ARCHIV ANSICHT (ZUM VERLASSEN KLICKEN)</div>

    <div class="header-bar">
        <h2 style="margin:0; font-size: 0.8rem; color: var(--accent);">Würfelboard v0.9855 Stable</h2>
        <div style="display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;">
            <button class="btn-top" onclick="toggleFullscreen()">📺 VOLLBILD</button>
            <button class="btn-top" onclick="saveCSV()">💾 BACKUP</button>
            <button class="btn-top" onclick="document.getElementById('csvIn').click()">📂 LADEN</button>
            <button id="btnViewToggle" class="btn-top" onclick="toggleMobile()">📱 MOBIL</button>
            <button id="btnRaceToggle" class="btn-top" onclick="toggleRaceMode()" style="background:#8e44ad;">🐎 RENNEN</button>
            
            <button class="btn-top" onclick="toggleTheme()">🌓 MODE</button>
            <button class="btn-top" onclick="openHistory()" style="background:var(--accent)">📜 HISTORIE</button>
            <button class="btn-top" onclick="finishCheck()" style="background:var(--win)">✨ NEU</button>
            <button class="btn-top" onclick="askMasterReset()" style="background:#555">🔄 RESET</button>
        </div>
    </div>

    <div class="stats-section" id="statsDisp"></div>
    <div class="setup-section" id="setupArea"><div class="names-grid" id="namesGrid"></div></div>
    
    <div id="raceTrackUI" class="race-track-container"></div>
    <div id="analysisUI" class="analysis-grid"></div>

    <div class="game-container">
        <div class="table-area">
            <table>
                <thead><tr id="hRow"></tr></thead>
                <tbody id="gBody"></tbody>
                <tfoot><tr id="tRow"></tr></tfoot>
            </table>
        </div>
        <div class="quick-pad" id="padUI">
            <div class="pad-viewport" id="padViewport" onscroll="updatePadDots()">
                <div class="pad-page" id="padPage1">
                    <button class="pad-btn btn-ronny" onclick="playPadSound(); setV(0)">0 (Ronny)</button>
                </div>
                <div class="pad-page" id="padPage2"></div>
                <div class="pad-page" id="padPage3"></div>
            </div>
            <div class="pad-dots">
                <div class="pad-dot active" id="dot1"></div>
                <div class="pad-dot" id="dot2"></div>
                <div class="pad-dot" id="dot3"></div>
            </div>
        </div>
    </div>
</div>

<div id="histView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding: 0 5px;">
        <h2 style="color:white; margin:0; font-size: 1.2rem;">Historie</h2>
        <button class="btn-top" onclick="document.getElementById('histView').style.display='none'" style="background:var(--ronny); padding: 5px 15px;">X</button>
    </div>
    <div id="arcList"></div>
</div>

<input type="file" id="csvIn" style="display:none" onchange="loadCSV(event)" accept=".csv,text/csv,text/plain">

<script>
    /* --- CUSTOM DIALOG ENGINE --- */
    function openAlert(title, text) {
        document.getElementById('customModalTitle').innerText = title;
        document.getElementById('customModalText').innerText = text;
        const btnArea = document.getElementById('customModalButtons');
        btnArea.innerHTML = '';
        
        const btn = document.createElement('button');
        btn.className = 'modal-btn modal-btn-ok';
        btn.innerText = 'OK';

    function playOscillatorFallback() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    function recalculateKingOfTheHill() {
        stats = Array(MAX_P).fill(0);
        
        archive.forEach(g => {
            let winText = g.w ? g.w.trim().toLowerCase() : "";
            if (winText === "") return;
            
            if (winText.includes("aggi") || winText.includes("spieler 1")) {
                stats[0]++;
                return;
            }
            if (winText.includes("david") || winText.includes("spieler 2")) {
                stats[1]++;
                return;
            }
            
            if (winText.startsWith("sieger: ")) {
                let sName = g.w.replace(/Sieger:\s*/i, "").trim().toLowerCase();
                let pIdx = pNames.findIndex(name => name && name.trim().toLowerCase() === sName);
                if (pIdx !== -1) { stats[pIdx]++; return; }
            }

            if (g.s && Array.isArray(g.s)) {
                let slotTotals = Array(MAX_P).fill(0);
                g.s.forEach(row => {
                    for (let i = 0; i < MAX_P; i++) {
                        let val = parseInt(row[i]);
                        if (!isNaN(val)) slotTotals[i] += val;
                    }
                });

                let maxScore = Math.max(...slotTotals);
                if (maxScore >= 10000) {
                    for (let i = 0; i < MAX_P; i++) {
                        if (slotTotals[i] === maxScore) {
                            stats[i]++;
                        }
                    }
                }
            }
        });
    }

            window.scrollBy({ top: elRect.top - 120, behavior: 'smooth' }); 
        }

        const tableArea = document.querySelector('.table-area');
        if (tableArea) {
            const stickyOffset = 78;

            if (targetBottom > tableArea.scrollTop + tableArea.clientHeight) {

                });
            }
        }
    }

    function renderRaceTrack() {
        if (!showRace) return;
        const sorted = getSortedActive();
        const activeScores = isArcView ? arcScores : scores;

        sorted.forEach(p => {
            let total = 0;
            activeScores.forEach(r => {
                const v = parseInt(r[p.i]);
                if(!isNaN(v)) total += v;
            });

            let pct = Math.min(100, (total / 10000) * 100);

            const origPath = document.querySelector(`#raceTrackUI #horse-wrapper-${p.i}`)?.closest('.race-track-path');
            const wrapperOrig = document.querySelector(`#raceTrackUI #horse-wrapper-${p.i}`);
            const textOrig = document.querySelector(`#raceTrackUI #horse-text-${p.i}`);

            if (origPath && wrapperOrig && textOrig) {
                const pathWidthOrig = origPath.getBoundingClientRect().width;
                const wrapperWidthOrig = wrapperOrig.getBoundingClientRect().width || 65;
                const availableWidthOrig = pathWidthOrig - wrapperWidthOrig;
                const calculatedLeftOrig = (pct / 100) * availableWidthOrig;

                wrapperOrig.style.right = 'auto';
                wrapperOrig.style.left = `${calculatedLeftOrig}px`;
                textOrig.innerText = `${total}`;
            }

            const copyPath = document.querySelector(`#raceTrackStickyCopy #horse-wrapper-${p.i}`)?.closest('.race-track-path');
            const wrapperCopy = document.querySelector(`#raceTrackStickyCopy #horse-wrapper-${p.i}`);
            const textCopy = document.querySelector(`#raceTrackStickyCopy #horse-text-${p.i}`);

            if (copyPath && wrapperCopy && textCopy) {
                const pathWidthCopy = copyPath.getBoundingClientRect().width;
                const wrapperWidthCopy = wrapperCopy.getBoundingClientRect().width || 65;
                const availableWidthCopy = pathWidthCopy - wrapperWidthCopy;
                const calculatedLeftCopy = (pct / 100) * availableWidthCopy;

                wrapperCopy.style.right = 'auto';
                wrapperCopy.style.left = `${calculatedLeftCopy}px`;
                textCopy.innerText = `${total}`;
            }
        });
    }

    function updateUI(sorted) {
        const activeScores = isArcView ? arcScores : scores;
        let dist = { ronny:{}, small:{}, med:{}, big:{}, elite:{}, meister:{} };
        let pendingWinners = [];

        sorted.forEach(p => {
            let total = 0;
            activeScores.forEach(r => {
                const v = parseInt(r[p.i]);
                if(!isNaN(v)) total += v;
            });
            if (total >= 10000) {
                pendingWinners.push(p.i);
            }
        });

        const f = document.getElementById('tRow'); f.innerHTML = '<td>Σ</td>';
        sorted.forEach(p => {
            let total = 0;
            activeScores.forEach(r => {
                const v = parseInt(r[p.i]);
                if(!isNaN(v)) {
                    total += v;
                    let cat = v===0?'ronny':v<=450?'small':v<=700?'med':v<=950?'big':v<=1500?'elite':'meister';
                    if(!dist[cat][p.i]) dist[cat][p.i] = 0;
                    dist[cat][p.i]++;
                }
            });
            let rest = 10000 - total;
            
            if (!isArcView) {
                if (rest < 1001 && rest > 0) {
                    if (!playedUnder1000[p.i]) {
                        playCustomAudio('unter-1000.mp3');
                        playedUnder1000[p.i] = true;
                    }
                } else if (rest >= 1001) {
                    playedUnder1000[p.i] = false;
                }

                if (rest <= 0) {
                    if (!playedWinnerSound[p.i]) {
                        playCustomAudio('sieger.mp3');
                        playedWinnerSound[p.i] = true;
                    }
                } else {
                    playedWinnerSound[p.i] = false;
                }
            }

            let statusClass = "";
            let displayText = rest;
            if (rest <= 0) {
                statusClass = "winner-blink";
                displayText = `👑 ${rest} 👑`;
            } else if (rest <= 1000) {
                statusClass = "near-win";
            }
            f.innerHTML += `<td><div class="score-box ${statusClass}"><span class="score-mobile-name">${p.n}</span><span class="score-down">${displayText}</span><span class="score-up">${total}</span></div></td>`;
        });

        const displayNamesSource = isArcView ? arcNames : pNames;
        document.getElementById('statsDisp').innerHTML = displayNamesSource.map((n,i)=>({n,i})).map(p => {
            if (!p.n || p.n.trim() === "") {
                return `<div class="stat-item" style="opacity: 0.2;"><span class="stat-name">-</span><span class="stat-wins">👑 0</span></div>`;
            }
            let isWinningNow = pendingWinners.includes(p.i) ? '<span class="pending-win">(+1)</span>' : '';
            return `<div class="stat-item"><span class="stat-name">${p.n}</span><span class="stat-wins">👑 ${stats[p.i]||0}${isWinningNow}</span></div>`;
        }).join('');

        const cats = [['RONNYS (0)','ronny'],['350 bis 450','small'],['500 bis 700','med'],['750 bis 950','big'],['1000 bis 1450','elite'],['Über 1500','meister']];
        document.getElementById('analysisUI').innerHTML = cats.map(c => {
            const details = sorted.map(p => `<div class="ana-row" style="font-size:0.9rem; margin-top:3px; display:flex; justify-content:between;"><span>${p.n}:</span> <b style="margin-left:auto;">${dist[c[1]][p.i] || 0}</b></div>`).join('');
            return `<div class="analysis-card"><div style="font-size:0.95rem; font-weight:bold; color:var(--accent); border-bottom: 1px solid var(--border); padding-bottom:3px; margin-bottom:5px;">${c[0]}</div>${details}</div>`;
        }).join('');

        renderRaceTrack();
    }

    function getSortedActive() { 
        const names = isArcView ? arcNames : pNames; 
        const active = names.map((n, i) => ({n, i})).filter(p => p.n && p.n.trim() !== ""); 
        if (active.length === 0) return [];
        const sPos = active.findIndex(p => p.i === startIdx); 
        return (sPos === -1) ? active : [...active.slice(sPos), ...active.slice(0, sPos)]; 
    }
    
    async function saveCSV() {
        const d = { pNames, scores, archive, startIdx, pEmojis };
        const jsonString = JSON.stringify(d);
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const fileName = `Würfel-Backup-${yy}.${mm}.${dd}-${hh}.${min}.csv`;
        
        try {
            const blob = new Blob([jsonString], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            openAlert("Erfolg", "Das Backup wurde erfolgreich erstellt und der Download wurde gestartet.");
        } catch (err) {
            openAlert("Fehler", "Das Backup konnte nicht erstellt werden.");
        }
    }

    function loadCSV(e) { 
        const r = new FileReader(); 
        r.onload = (ev) => { 
            try { 
                const d = JSON.parse(ev.target.result); 
                pNames=d.pNames; scores=d.scores; archive=d.archive; startIdx=d.startIdx; 
                if(d.pEmojis) pEmojis=d.pEmojis; 
                save(); render(); 
            } catch(err) { 
                openAlert("Fehler", "Die Datei konnte nicht als gültiges Backup geladen werden!"); 
            } 
        }; 
        r.readAsText(e.target.files[0]); 
    }
    
    function openHistory() { document.getElementById('histView').style.display = 'block'; renderArchiveList(); }
    
    function renderArchiveList() { 
        document.getElementById('arcList').innerHTML = archive.map((g, idx) => {
            let displayW = sanitizeOldNames(g.w);
            return `
            <div class="history-item">
                <div><strong>${g.d}</strong><br><small>${displayW}</small></div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn-load-hist" onclick="showArchiveGame(${idx})">LADEN</button>
                    <button class="btn-load-hist" style="background:var(--ronny);" onclick="deleteHistoryItem(${idx})">LÖSCHEN</button>
                </div>
            </div>`;
        }).join('') + (archive.length > 0 ? `<button class="btn-top" style="background:var(--ronny); width:100%; margin-top:15px; padding:10px 0;" onclick="clearAllHistory()">⚠️ GESAMTE HISTORIE LÖSCHEN</button>` : '<div style="color:#aaa; text-align:center; padding:20px;">Keine Einträge vorhanden</div>'); 
    }
    
    function deleteHistoryItem(idx) {
        openConfirm(
            "Eintrag löschen?",
            "Diesen Eintrag aus der Historie löschen? (Die Kronen-Statistik wird sofort live angepasst)",
            () => {
                openConfirm(
                    "Absolut sicher?",
                    "Bist du dir wirklich absolut sicher? Dieser Schritt kann nicht rückgängig gemacht werden!",
                    () => {
                        archive.splice(idx, 1);
                        save();
                        renderArchiveList();
                        render();
                    }
                );
            }
        );
    }

    function clearAllHistory() {
        openConfirm(
            "GESAMTE Historie löschen?",
            "Möchtest du wirklich die GESAMTE Historie unwiderruflich löschen? (Dadurch werden auch ALLE Kronen zurückgesetzt)",
            () => {
                openConfirm(
                    "Sämtliche Daten verlieren?",
                    "Bist du dir wirklich absolut sicher? SÄMTLICHE Spiele und Statistiken gehen verloren!",
                    () => {
                        archive = [];
                        save();
                        renderArchiveList();
                        render();
                    }
                );
            }
        );
    }

    function showArchiveGame(idx) { 
        let rawNames = archive[idx].names || pNames;
        arcNames = rawNames.map(n => sanitizeOldNames(n)); 
        arcScores = JSON.parse(JSON.stringify(archive[idx].s)); 
        isArcView = true; 
        document.getElementById('arcBanner').style.display = 'block'; 
        document.getElementById('histView').style.display='none'; 
        render(); 
    }
    
    function exitArchive() { isArcView = false; document.getElementById('arcBanner').style.display = 'none'; render(); }
    
    function askMasterReset() { 
        openConfirm(
            "Kompletter Board-Reset?",
            "Möchtest du wirklich das Board komplett zurücksetzen? (Dadurch werden ALLE Namen, aktuellen Punkte und die komplette Historie unwiderruflich gelöscht)",
            () => {
                openConfirm(
                    "Unwiderruflich löschen?",
                    "Bist du dir absolut sicher? Es gibt KEINE Möglichkeit, die Daten danach wiederherzustellen (außer du hast ein Backup)!",
                    () => {
                        localStorage.clear(); 
                        location.reload(); 
                    }
                );
            }
        );
    }

    function finishCheck() {
        const active = getSortedActive(); let winners = [];
        active.forEach(p => { let s = 0; scores.forEach(r => s += (parseInt(r[p.i]) || 0)); if(s >= 10000) { winners.push(p.n); } });
        
        let winText = "-";
        if (winners.length > 1) {
            winText = "Unentschieden: " + winners.join(", ");
            finishGame(winText);
        } else if (winners.length === 1) {
            winText = "Sieger: " + winners[0];
            finishGame(winText);
        } else {
            openConfirm(
                "Spiel vorzeitig abbrechen?",
                "Achtung: Es hat noch kein Spieler die 10.000 Punkte erreicht!\n\nMöchtest du dieses laufende Spiel wirklich vorzeitig abbrechen und eine neue Runde starten?",
                () => {
                    winText = "Vorzeitig beendet";
                    finishGame(winText);
                }
            );
        }
    }

    function finishGame(winText) {
        archive.unshift({ d: new Date().toLocaleString(), w: winText, s: JSON.parse(JSON.stringify(scores)), names: JSON.parse(JSON.stringify(pNames)) });
        scores = [Array(MAX_P).fill("")]; 
        
        playCustomAudio('neue-runde.mp3');
        
        playedUnder1000 = Array(MAX_P).fill(false);
        playedWinnerSound = Array(MAX_P).fill(false);
        
        const sorted = getSortedActive();
        if (sorted.length > 0) {
            focus = { r: 0, pI: sorted[0].i, apIdx: 0 };
        }
        
        recalculateKingOfTheHill();
        render(); 
        save();
    }

    window.addEventListener('scroll', () => {
        const stickyCopy = document.getElementById('raceTrackStickyCopy');
        
        if (window.scrollY >= 450 && viewMode === 'mobile' && showRace && window.innerWidth < window.innerHeight) {
            if (stickyCopy.style.display !== 'block') {
                stickyCopy.style.display = 'block';
                renderRaceTrack();
            }
        } else {
            stickyCopy.style.display = 'none';
        }
    }, { passive: true });

    const page1 = document.getElementById('padPage1');
    for(let v=350; v<=1300; v+=50) { 
        const b = document.createElement('button'); 
        b.className='pad-btn'; 
        b.innerText=v; 
        b.onclick=()=> { playPadSound(); setV(v); }; 
        page1.appendChild(b); 
    }

    const page2 = document.getElementById('padPage2');
    for(let v=1350; v<=2500; v+=50) { 
        const b = document.createElement('button'); 
        b.className='pad-btn'; 
        b.innerText=v; 
        b.onclick=()=> { playPadSound(); setV(v); }; 
        page2.appendChild(b); 
    }

    const page3 = document.getElementById('padPage3');
    for(let v=2550; v<=3700; v+=50) { 
        const b = document.createElement('button'); 
        b.className='pad-btn'; 
        b.innerText=v; 
        b.onclick=()=> { playPadSound(); setV(v); }; 
        page3.appendChild(b); 
    }

    render();
</script>
</body>
</html>
